<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 모듈</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="Menu_full">
        <header>
            <div class="Menu_button">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </header>
        <div class="header_wrap"></div>
    </div>
    <script>
        const Menu_button = document.querySelector(".Menu_button");
        const header_wrap = document.querySelector(".header_wrap");
        Menu_button.addEventListener("mouseover", () => {
            Menu_button.classList.add("on");
            Menu_button.classList.remove("off");
            header_wrap.classList.add("on");
        });
        Menu_button.addEventListener("mouseleave", () => {
            Menu_button.classList.add("off");
            Menu_button.classList.remove("on");
            header_wrap.classList.remove("on");
        });
    </script>
</body>

</html>
