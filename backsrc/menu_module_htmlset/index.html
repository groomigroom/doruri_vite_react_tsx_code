<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 모듈</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="Menu_full">
        <header>
            <div class="Menu_button">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <nav>
                <ul>
                    <li>메뉴1
                        <ul>
                            <li><a href="">세부1</a></li>
                            <li><a href="">세부2</a></li>
                            <li><a href="">세부3</a></li>
                            <li><a href="">세부4</a></li>
                        </ul>
                    </li>
                    <li>메뉴2
                        <ul>
                            <li><a href="">세부1</a></li>
                            <li><a href="">세부2</a></li>
                            <li><a href="">세부3</a></li>
                            <li><a href="">세부4</a></li>
                        </ul>
                    </li>
                    <li>메뉴3
                        <ul>
                            <li><a href="">세부1</a></li>
                            <li><a href="">세부2</a></li>
                            <li><a href="">세부3</a></li>
                            <li><a href="">세부4</a></li>
                        </ul>
                    </li>
                    <li>메뉴4
                        <ul>
                            <li><a href="">세부1</a></li>
                            <li><a href="">세부2</a></li>
                            <li><a href="">세부3</a></li>
                            <li><a href="">세부4</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </header>
        <div class="header_wrap"></div>
    </div>
    <script>
        const Menu_button = document.querySelector(".Menu_button");
        const header_wrap = document.querySelector(".header_wrap");
        const nav = document.querySelector("nav");
        Menu_button.addEventListener("mouseover", () => {
            Menu_button.classList.add("on");
            Menu_button.classList.remove("off");
            header_wrap.classList.add("on");
            nav.style.height = "200px";
        });
        Menu_button.addEventListener("mouseleave", () => {
            Menu_button.classList.add("off");
            Menu_button.classList.remove("on");
            header_wrap.classList.remove("on");
            nav.style.height = "0px";
        });
    </script>
</body>

</html>
